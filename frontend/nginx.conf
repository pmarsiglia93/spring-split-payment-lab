server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://orchestrator-service:8080;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
