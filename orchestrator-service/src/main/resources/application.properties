spring.application.name=orchestrator-service
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/orchestratordb}
spring.data.mongodb.auto-index-creation=true
server.port=${SERVER_PORT:8080}
management.endpoints.web.exposure.include=health
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [${spring.application.name}] [correlationId=%X{correlationId:-none}] %logger{36} - %msg%n

services.payment.url=${PAYMENT_SERVICE_URL:http://localhost:8081}
services.split.url=${SPLIT_SERVICE_URL:http://localhost:8082}
services.transfer.url=${TRANSFER_SERVICE_URL:http://localhost:8083}

resilience4j.retry.instances.splitService.max-attempts=3
resilience4j.retry.instances.splitService.wait-duration=200ms
resilience4j.retry.instances.splitService.enable-exponential-backoff=true
resilience4j.retry.instances.splitService.exponential-backoff-multiplier=2
resilience4j.circuitbreaker.instances.splitService.sliding-window-size=5
resilience4j.circuitbreaker.instances.splitService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.splitService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.splitService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.splitService.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.splitService.automatic-transition-from-open-to-half-open-enabled=true
